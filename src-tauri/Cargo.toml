[package]
name = "serien-umbenenner"
version = "0.1.5"
description = "A safe local batch renamer for video files"
authors = ["Serien-Umbenenner contributors"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
